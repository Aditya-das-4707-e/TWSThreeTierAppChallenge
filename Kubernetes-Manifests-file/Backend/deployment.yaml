apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      role: api
  template:
    metadata:
      labels:
        role: api
    spec:
      containers:
      - name: api
        image: aditya81888/three-tier-backend:latest
        ports:
        - containerPort: 3500
        env:
        - name: MONGO_CONN_STR
          value: mongodb://admin:password123@mongodb-svc:27017/todo?authSource=admin
        livenessProbe:
          httpGet:
            path: /ok
            port: 3500
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /ok
            port: 3500
          initialDelaySeconds: 5
